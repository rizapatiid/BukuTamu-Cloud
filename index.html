<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buku Tamu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23111'/%3E%3Cpath d='M7 7h4a2 2 0 0 1 2 2v8a1.5 1.5 0 0 0-1.5-1.5H7zM17 7h-2a2 2 0 0 0-2 2' fill='none' stroke='%23fff' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- SVG icons -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/></symbol>
    <symbol id="i-loader" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></symbol>
  </svg>

  <header class="header">
    <div class="wrap header-inner">
      <span class="brand">
        <span class="brand-name">Buku Tamu</span>
      </span>
      <div id="status" class="status">
        <span class="dot"></span><span class="status-text">Memuat</span>
      </div>
    </div>
  </header>

  <main class="wrap main">
    <div class="page-head">
      <div>
        <p class="eyebrow" id="tanggalHariIni">-</p>
        <h1>Buku Tamu</h1>
        <p class="lead">Terima kasih atas kunjungan Anda. Silakan isi data berikut sebagai catatan kunjungan.</p>
      </div>
      <dl class="summary">
        <div><dt>Total tamu</dt><dd id="statTotal">0</dd></div>
        <div><dt>Hari ini</dt><dd id="statHariIni">0</dd></div>
      </dl>
    </div>

    <div class="layout">
      <!-- Form -->
      <section class="panel">
        <h2 class="panel-title">Isi buku tamu</h2>

        <form id="guestForm" novalidate>
          <div class="field">
            <label for="nama">Nama lengkap <span class="req">*</span></label>
            <input type="text" id="nama" maxlength="50" autocomplete="name" required />
          </div>

          <div class="field">
            <label for="instansi">Instansi / asal <span class="req">*</span></label>
            <input type="text" id="instansi" maxlength="80" autocomplete="organization" required />
          </div>

          <div class="row">
            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" maxlength="80" autocomplete="email" />
            </div>
            <div class="field">
              <label for="telepon">No. telepon</label>
              <input type="tel" id="telepon" maxlength="15" autocomplete="tel" inputmode="tel" />
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label for="keperluan">Keperluan <span class="req">*</span></label>
              <select id="keperluan" required>
                <option value="" selected disabled>Pilih</option>
                <option>Kunjungan</option>
                <option>Rapat</option>
                <option>Konsultasi</option>
                <option>Wawancara</option>
                <option>Pengiriman barang</option>
                <option>Lainnya</option>
              </select>
            </div>
            <div class="field">
              <label for="bertemu">Bertemu dengan</label>
              <input type="text" id="bertemu" maxlength="50" />
            </div>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="pesan">Pesan &amp; kesan <span class="req">*</span></label>
              <span class="counter"><span id="hitung">0</span>/500</span>
            </div>
            <textarea id="pesan" rows="4" maxlength="500" required></textarea>
          </div>

          <button type="submit" id="btnKirim" class="btn">
            <span>Simpan</span>
            <svg class="icon"><use href="#i-arrow"/></svg>
          </button>
        </form>
      </section>

      <!-- Daftar tamu -->
      <section class="panel">
        <div class="list-head">
          <h2 class="panel-title">Daftar tamu</h2>
          <div class="search">
            <svg class="icon"><use href="#i-search"/></svg>
            <input type="search" id="cari" placeholder="Cari" aria-label="Cari tamu" />
          </div>
        </div>

        <ul id="daftarTamu" class="list">
          <li class="empty"><span>Memuat data…</span></li>
        </ul>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap">&copy; <span id="tahun"></span> RIZA PROJECTS &mdash; RIZAPATIID. All rights reserved.</div>
  </footer>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
